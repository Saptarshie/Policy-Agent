<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolicyPilot — RAG policy QA</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2740; --line: #2a3652;
    --text: #e8ecf5; --muted: #93a0b8; --accent: #5b9dff; --accent2: #8b5cf6;
    --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --cite: #7dd3fc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  header h1 span { color: var(--accent); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--panel2);
           border: 1px solid var(--line); color: var(--muted); }
  .badge b { color: var(--text); font-weight: 600; }
  .badge.alert { border-color: var(--bad); color: var(--bad); }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr 360px; gap: 12px;
         padding: 12px; min-height: 0; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
        display: flex; flex-direction: column; min-height: 0; }
  .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
           color: var(--muted); margin: 0; padding: 12px 14px 8px;
           display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .btn.tiny { padding: 2px 8px; font-size: 11px; letter-spacing: 0; text-transform: none; }
  .colbody { overflow-y: auto; padding: 0 12px 12px; flex: 1; }
  .doc { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .doc .name { font-weight: 600; }
  .doc .meta { color: var(--muted); font-size: 11px; margin: 4px 0; }
  .chip { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 999px;
         margin-left: 6px; vertical-align: middle; }
  .chip.ready { background: rgba(52,211,153,.15); color: var(--ok); }
  .chip.ingesting, .chip.pending, .chip.running { background: rgba(251,191,36,.15); color: var(--warn); }
  .chip.error { background: rgba(248,113,113,.15); color: var(--bad); }
  .chip.flag { background: rgba(248,113,113,.2); color: var(--bad); }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2));
                border: none; color: #fff; font-weight: 600; }
  .progress { height: 5px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--warn); width: 0%; transition: width .4s; }
  #uploadRow { display: flex; gap: 6px; padding: 0 12px 10px; }
  #uploadRow input[type=file] { display: none; }
  #chatlog { display: flex; flex-direction: column; gap: 10px; }
  .msg { border-radius: 12px; padding: 10px 14px; font-size: 14px; white-space: pre-wrap;
        line-height: 1.55; max-width: 92%; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #2b4a86, #33507f); }
  .msg.agent { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); }
  .msg .cite { color: var(--cite); background: rgba(125,211,252,.1); border-radius: 4px;
              padding: 0 3px; font-size: 12px; font: inherit; font-size: 12px;
              border: 1px solid transparent; cursor: pointer; }
  .msg .cite:hover { border-color: var(--cite); text-decoration: underline; }
  .msg .cite:focus-visible { outline: 2px solid var(--cite); outline-offset: 1px; }
  .msg .cite.bad-cite { color: var(--bad); background: rgba(248,113,113,.1); }
  /* citation verification panel: the passage a chip points at, so a reader can check it */
  #citePanel { position: fixed; right: 12px; bottom: 12px; width: min(560px, 60vw);
               max-height: 62vh; display: flex; flex-direction: column; z-index: 40;
               background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
               box-shadow: 0 12px 40px rgba(0,0,0,.55); }
  #citePanel[hidden] { display: none; }
  .citeHead { display: flex; align-items: center; justify-content: space-between; gap: 10px;
              padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .citeHead .t { font-size: 12px; color: var(--cite); word-break: break-word; }
  .citeMeta { padding: 7px 12px 0; font-size: 12px; color: var(--muted); }
  .citeMeta .ok { color: var(--ok); } .citeMeta .bad { color: var(--bad); }
  .citeHead .acts { display: flex; gap: 6px; }
  #citeText { margin: 8px 12px 12px; overflow: auto; font-size: 12.5px; line-height: 1.5;
              color: var(--text); background: #101624;
              border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  #citeText.raw { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
  #citeText h3, #citeText h4, #citeText h5 { margin: 10px 0 6px; font-size: 13px; }
  #citeText p { margin: 6px 0; }
  #citeText ul, #citeText ol { margin: 6px 0 6px 18px; padding: 0; }
  #citeText table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  #citeText th, #citeText td { border: 1px solid var(--line); padding: 4px 8px;
                               vertical-align: top; text-align: left; }
  #citeText th { background: var(--panel2); color: var(--muted); font-weight: 600; }
  #citeText blockquote { margin: 6px 0; padding-left: 8px; border-left: 2px solid var(--line);
                        color: var(--muted); }
  #citeText .part + .part { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  #citeText .plabel { display: block; font-size: 10px; color: var(--muted); letter-spacing: .06em;
                      text-transform: uppercase; margin-bottom: 4px; }
  details.trace summary .el { color: var(--muted); font-size: 10px; margin-left: 6px; }
  .warnbox { margin-top: 8px; font-size: 12px; color: var(--warn);
            background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3);
            border-radius: 8px; padding: 6px 10px; }
  details.trace { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details.trace summary { cursor: pointer; color: var(--accent); font-size: 11px; }
  details.trace pre { background: #101624; border: 1px solid var(--line); border-radius: 8px;
                     padding: 8px; overflow-x: auto; white-space: pre-wrap; }
  #inputRow { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  #question { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
             border-radius: 10px; padding: 10px 12px; font-size: 14px; resize: none;
             font-family: inherit; }
  #question:focus { outline: none; border-color: var(--accent); }
  .flag { background: var(--panel2); border: 1px solid rgba(248,113,113,.4); border-radius: 10px;
         padding: 10px; margin-bottom: 10px; font-size: 12.5px; }
  .flag .head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .flag .head b { color: var(--bad); font-size: 13px; }
  .flag blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--line);
                    background: #101624; border-radius: 0 8px 8px 0; color: var(--muted); }
  .flag .why { color: var(--text); margin: 6px 0; }
  .flag .sig { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px; }
  .thinking { color: var(--muted); font-style: italic; font-size: 12px; }
  /* live ReAct trace: steps appear as the agent takes them */
  .live .trace { margin: 0; }
  .live .trace > summary { color: var(--accent); }
  .live .steps { margin-top: 6px; }
  .live .step { margin: 3px 0 3px 2px; padding-left: 8px; border-left: 2px solid var(--line); }
  .live .step > summary { cursor: pointer; font-size: 11.5px; color: var(--text); }
  .live .step > pre { margin: 4px 0 6px; background: #101624; border: 1px solid var(--line);
                      border-radius: 6px; padding: 6px 8px; font-size: 11.5px;
                      white-space: pre-wrap; max-height: 220px; overflow: auto; }
  .live .step.tool > summary { color: var(--accent); }
  .live .step.err > summary { color: var(--bad); }
  .live .stage { font-size: 11.5px; color: var(--muted); margin: 3px 0; }
  .live .answer { margin-top: 8px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--warn); margin-right: 6px; animation: pulse 1.1s infinite; }
  .dot.done { background: var(--ok); animation: none; }
  .dot.stalled { background: var(--warn); }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  .msg h3, .msg h4, .msg h5, .msg h6 { margin: 10px 0 4px; font-size: 14px; }
  .msg h3 { font-size: 15px; }
  .msg ul, .msg ol { margin: 4px 0 4px 18px; padding: 0; }
  .msg li { margin: 2px 0; }
  .msg code { background: #101624; border-radius: 4px; padding: 1px 4px; font-size: 12.5px; }
  .msg blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--line);
                    background: #101624; border-radius: 0 8px 8px 0; color: var(--muted); }
  .msg table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; display: block; overflow-x: auto; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .msg th { background: #101624; }
  .msg hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>📜 Policy<span>Pilot</span> — RAG policy QA</h1>
  <div class="badges" id="badges"></div>
</header>
<main>
  <section class="col">
    <h2>Documents</h2>
    <div id="uploadRow">
      <label class="btn primary" for="fileInput">＋ Upload</label>
      <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf" multiple>
    </div>
    <div class="colbody" id="docList"><div class="empty">loading…</div></div>
  </section>
  <section class="col">
    <h2>Ask the policy agent
      <button class="btn tiny" id="newChat" title="Clear this conversation (the agent forgets the earlier turns)">＋ New conversation</button>
    </h2>
    <div class="colbody" id="chatlog">
      <div class="msg agent">Hi! Ask me anything about the ingested policy documents.
I search, read and cite the actual policy text — and I'll tell you when the documents don't cover something.</div>
    </div>
    <div id="inputRow">
      <textarea id="question" rows="2" placeholder="e.g. How many days per week can I work remotely? (Enter to send)"></textarea>
      <button class="btn primary" id="sendBtn">Send</button>
    </div>
  </section>
  <section class="col">
    <h2>Contradiction tracker</h2>
    <div class="colbody" id="flagList"><div class="empty">loading…</div></div>
  </section>
</main>
<aside id="citePanel" hidden>
  <div class="citeHead">
    <span class="t" id="citeTitle"></span>
    <span class="acts">
      <button class="btn tiny" id="citeRaw" title="show the passage exactly as stored">raw</button>
      <button class="btn tiny" id="citeClose">close</button>
    </span>
  </div>
  <div class="citeMeta" id="citeMeta"></div>
  <div id="citeText"></div>
</aside>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// A citation chip is a BUTTON: clicking it resolves [doc § section] against the
// store and shows the passage, so the reader can check the claim instead of
// trusting it. A citation that does not resolve is marked, not hidden.
const citeHtml = (html) => html.replace(
  /\[([^\[\]<]{3,120})\]/g,
  (m, inner) => (/§/.test(inner) || /#[0-9]+\s*$/.test(inner) || /^[A-Za-z0-9_.\- ]+$/.test(inner))
    ? `<button type="button" class="cite" data-cite="${esc(inner)}" `
      + `title="show the passage this cites">[${inner}]</button>` : m);

let citeLast = null;                 // {text, parts} behind the panel, for the raw toggle

// The chunk is stored markdown. Rendering it means headings and tables are readable
// instead of showing '##' and rows of pipes; "raw" gives the exact stored bytes.
// A section split over several chunks is shown in order, each labelled with its id,
// so a table that continues across chunks does not look truncated.
function paintCitation() {
  const body = $('citeText');
  const parts = (citeLast && citeLast.parts && citeLast.parts.length)
    ? citeLast.parts : [{ text: (citeLast && citeLast.text) || '' }];
  if ($('citeRaw').dataset.on === '1') {
    body.classList.add('raw');
    body.textContent = parts.length > 1
      ? parts.map((p, i) => `--- chunk ${p.chunk_id ?? ''} ---\n${p.text || ''}`).join('\n\n')
      : (parts[0].text || '');
    return;
  }
  body.classList.remove('raw');
  body.innerHTML = parts.map((p) => (parts.length > 1
    ? `<div class="part"><span class="plabel">chunk ${esc(p.chunk_id ?? '')}</span>`
      + citeHtml(md(p.text || '')) + '</div>'
    : citeHtml(md(p.text || '')))).join('');
}

async function openCitation(cite, btn) {
  const panel = $('citePanel'), meta = $('citeMeta'), body = $('citeText');
  $('citeTitle').textContent = cite;
  meta.textContent = 'looking up the passage…';
  body.textContent = '';
  $('citeRaw').dataset.on = '0';       // a fresh citation opens rendered
  panel.hidden = false;
  try {
    const r = await api('/api/citations/resolve?cite=' + encodeURIComponent(cite));
    btn.classList.toggle('bad-cite', !r.found);
    if (r.found) {
      meta.innerHTML = `<span class="ok">✓ found in the ingested text</span>`
        + ` · ${esc(r.doc)}${r.section ? ' § ' + esc(r.section) : ''}`
        + (r.chunk_id ? ` · chunk ${esc(r.chunk_id)}` : '')
        + (r.how && r.how !== 'exact' ? ` · ${esc(r.how)} match` : '');
      citeLast = { text: r.text || '', parts: r.parts || [] };
      paintCitation();
    } else {
      const why = r.reason === 'no-document' ? 'that document is not in the store'
        : r.reason === 'no-section' ? 'that section is not in this document'
        : 'no matching passage';
      meta.innerHTML = `<span class="bad">✗ ${esc(why)}</span>`;
      citeLast = { text: (r.candidates && r.candidates.length)
        ? 'sections this document actually has:\n- ' + r.candidates.join('\n- ')
        : 'the citation does not resolve to any stored text.', parts: [] };
      $('citeRaw').dataset.on = '1';   // nothing to format, so plain text
      paintCitation();
    }
  } catch (e) {
    meta.innerHTML = `<span class="bad">✗ ${esc(e.message)}</span>`;
  }
}

const history = [];
// the welcome bubble is also what "New conversation" restores
const WELCOME = 'Hi! Ask me anything about the ingested policy documents.\n'
  + "I search, read and cite the actual policy text — and I'll tell you when the "
  + "documents don't cover something.";
// one in-flight stream at a time; starting a new conversation aborts it
let inflight = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

// ---------------- health + polling ----------------
async function refreshHealth() {
  try {
    const h = await api('/api/health');
    $('badges').innerHTML = `
      <span class="badge">LLM <b>${esc(h.llm_model)}</b>${h.llm_configured ? '' : ' (not configured)'}</span>
      <span class="badge">embeddings <b>${esc(h.embed_model)}</b></span>
      <span class="badge">docs <b>${h.ready_documents}/${h.documents}</b></span>
      <span class="badge ${h.open_contradictions ? 'alert' : ''}">open conflicts <b>${h.open_contradictions}</b></span>
      <span class="badge">JEV gate ≥ <b>${h.jev_gate_threshold}</b></span>`;
  } catch (e) { $('badges').innerHTML = `<span class="badge alert">${esc(e.message)}</span>`; }
}

function progressHtml(job) {
  if (!job) return '';
  const pct = job.total ? Math.round(100 * (job.done||0) / job.total) : 0;
  const cls = job.status === 'error' ? 'var(--bad)' : job.status === 'done' ? 'var(--ok)' : 'var(--warn)';
  return `<div class="progress"><div style="width:${pct}%;background:${cls}"></div></div>
          <div class="meta">${esc(job.kind)} ${job.done||0}/${job.total} — ${esc(job.stage||job.status)}</div>`;
}

async function refreshDocs() {
  try {
    const docs = await api('/api/documents');
    if (!docs.length) { $('docList').innerHTML = '<div class="empty">No documents yet. Upload txt / md / pdf policies.</div>'; return; }
    $('docList').innerHTML = docs.map(d => {
      const job = d.latest_job;
      const running = job && job.status === 'running';
      return `<div class="doc">
        <div class="name">${esc(d.name)} <span class="chip ${esc(d.status)}">${esc(d.status)}</span>
          ${d.open_contradictions ? `<span class="chip flag">${d.open_contradictions} conflict(s)</span>` : ''}</div>
        <div class="meta">${esc(d.format)} · ${d.chunk_count} chunks · ${(d.size_bytes/1024).toFixed(1)} KB
          ${running ? progressHtml(job) : ''}</div>
        ${d.summary ? `<details><summary style="color:var(--muted);font-size:11px;cursor:pointer">rolling summary</summary>
          <div class="meta">${esc(d.summary)}</div></details>` : ''}
        <div style="margin-top:6px">
          ${d.status === 'ready' ? `<button class="btn" data-rescan="${d.id}">rescan conflicts</button>` : ''}
          <button class="btn danger" data-del="${d.id}" data-name="${esc(d.name)}">delete</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) { $('docList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function refreshFlags() {
  try {
    const flags = await api('/api/contradictions?status=OPEN');
    if (!flags.length) { $('flagList').innerHTML = '<div class="empty">No open contradictions. Upload two conflicting policies to see the cascade fire.</div>'; return; }
    $('flagList').innerHTML = flags.map(f => `
      <div class="flag">
        <div class="head"><b>#${f.id}</b>
          <span class="chip ${f.verified ? 'ready' : 'error'}">${f.verified ? 'LLM-verified' : 'unverified'}</span>
          <span class="chip">${esc(f.conflict_type) || 'conflict'}</span>
          <span class="chip">conf ${Number(f.confidence).toFixed(2)}</span>
          <span class="chip">gate ${Number(f.gate_score).toFixed(2)}</span>
        </div>
        <div>A: <b>${esc(f.doc_a)}</b> § ${esc(f.section_a)} (chunk ${f.chunk_a_id})</div>
        <blockquote>${esc((f.text_a||'').slice(0,300))}…</blockquote>
        <div>B: <b>${esc(f.doc_b)}</b> § ${esc(f.section_b)} (chunk ${f.chunk_b_id})</div>
        <blockquote>${esc((f.text_b||'').slice(0,300))}…</blockquote>
        <div class="why"><b>Why they conflict:</b> ${esc(f.explanation)}</div>
        ${(f.points||[]).map(p => `<div class="sig">• ${esc(p.topic)}: A="${esc(p.claim_a)}" vs B="${esc(p.claim_b)}"</div>`).join('')}
        <details class="trace"><summary>gate signals (JEV decision model)</summary>
          <div class="sig">${(f.gate_signals||[]).map(esc).join('<br>')}</div></details>
        <div style="margin-top:8px">
          <button class="btn" data-flag="${f.id}" data-status="resolved">✔ resolved</button>
          <button class="btn" data-flag="${f.id}" data-status="dismissed">✕ dismiss</button>
        </div>
      </div>`).join('');
  } catch (e) { $('flagList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function poll() { await Promise.all([refreshHealth(), refreshDocs(), refreshFlags()]); }

// ---------------- actions ----------------
$('fileInput').addEventListener('change', async (ev) => {
  for (const file of ev.target.files) {
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch('/api/documents', { method: 'POST', body: fd });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      addMsg('agent', `📥 Uploaded "${file.name}" — rolling-window ingestion started. ` +
        `Watch progress in the Documents column; the contradiction cascade runs automatically when it finishes.`);
    } catch (e) { addMsg('agent', '⚠ upload failed: ' + e.message); }
  }
  ev.target.value = '';
  poll();
});

async function delDoc(id, name) {
  if (!confirm(`Delete "${name}" and all its chunks/flags?`)) return;
  try { await api(`/api/documents/${id}`, { method: 'DELETE' }); } catch (e) { alert(e.message); }
  poll();
}

async function rescan(id) {
  try { await api(`/api/scan/${id}`, { method: 'POST' }); addMsg('agent', '🔍 contradiction scan queued.'); }
  catch (e) { alert(e.message); }
  poll();
}

// one listener per list: ids and names live in data attributes, never in a
// script context, so a name like Bob's "Q1" policy cannot break the markup
$('docList').addEventListener('click', (ev) => {
  const rescanBtn = ev.target.closest('[data-rescan]');
  if (rescanBtn) { rescan(Number(rescanBtn.dataset.rescan)); return; }
  const delBtn = ev.target.closest('[data-del]');
  if (delBtn) { delDoc(Number(delBtn.dataset.del), delBtn.dataset.name || ''); }
});

$('flagList').addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-flag]');
  if (btn) setFlag(Number(btn.dataset.flag), btn.dataset.status);
});

async function setFlag(id, status) {
  try { await api(`/api/contradictions/${id}/status`, { method: 'POST', body: JSON.stringify({ status }) }); }
  catch (e) { alert(e.message); }
  poll();
}

// Markdown the agent actually emits, rendered AFTER escaping: headings, bold,
// italics, inline code, bullet and numbered lists, blockquotes, tables, rules.
// Anything not matched stays as text, so an odd answer degrades to plain text
// rather than to broken HTML.
function md(raw) {
  const lines = esc(raw).split('\n');
  const out = [];
  let list = null, table = null;
  const flushList = () => {
    if (list) { out.push(`<${list.tag}>${list.items.join('')}</${list.tag}>`); list = null; }
  };
  const flushTable = () => {
    if (!table || !table.length) { table = null; return; }
    const [head, ...body] = table;
    out.push('<table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead>'
      + (body.length ? '<tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody>' : '')
      + '</table>');
    table = null;
  };
  const inline = (t) => t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // bold may CONTAIN italics ("**One thing that is *not* a conflict:**"), so
    // the inner pattern has to allow single asterisks; italic runs afterwards on
    // the remaining pairs, which is why the order matters
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

  for (const line of lines) {
    const t = line.trim();
    if (!t) { flushList(); flushTable(); out.push(null); continue; }   // null = paragraph break
    if (/^\|.*\|$/.test(t)) {                        // markdown table row
      if (/^\|[\s:|-]+\|$/.test(t)) { continue; }    // |---|---| separator
      flushList();
      (table = table || []).push(t.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim())));
      continue;
    }
    flushTable();
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushList(); const n = Math.min(h[1].length + 2, 6); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
    if (/^([-*_])\1{2,}$/.test(t)) { flushList(); out.push('<hr>'); continue; }
    const b = t.match(/^[-*+]\s+(.*)$/);
    if (b) { if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
             list.items.push(`<li>${inline(b[1])}</li>`); continue; }
    const o = t.match(/^(\d+)[.)]\s+(.*)$/);
    if (o) { if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
             list.items.push(`<li>${inline(o[2])}</li>`); continue; }
    const q = t.match(/^&gt;\s?(.*)$/);
    if (q) { flushList(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue; }
    flushList();
    out.push(inline(t) + '<br>');
  }
  flushList(); flushTable();
  // one blank line at most between blocks, none at the edges
  const kept = [];
  for (const item of out) {
    if (item === null) { if (kept.length && kept[kept.length - 1] !== '') kept.push(''); continue; }
    kept.push(item);
  }
  while (kept.length && kept[kept.length - 1] === '') kept.pop();
  return kept.join("\n");
}

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = cls === 'agent' ? citeHtml(md(text)) : esc(text);
  $('chatlog').appendChild(div);
  $('chatlog').scrollTop = $('chatlog').scrollHeight;
  return div;
}

// POST and read the response as Server-Sent Events. Falls back to the plain
// endpoint if the server streams nothing (older build / proxy that buffers).
async function streamAsk(payload, onFrame, signal) {
  const res = await fetch('/api/ask/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal,
  });
  if (!res.ok || !res.body) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const raw = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      if (raw.startsWith(':')) continue;              // keep-alive comment
      let event = 'message', data = '';
      for (const line of raw.split('\n')) {
        if (line.startsWith('event: ')) event = line.slice(7).trim();
        else if (line.startsWith('data: ')) data += line.slice(6);
      }
      let parsed = {};
      try { parsed = data ? JSON.parse(data) : {}; } catch { parsed = { raw: data }; }
      onFrame(event, parsed);
    }
  }
}

function stepLabel(step) {
  if (step.type === 'tool_call') return `TOOL ${esc(step.tool)}(${esc(JSON.stringify(step.arguments || {}))})`;
  if (step.type === 'tool_error') return `TOOL_ERROR ${esc(step.tool)} — ${esc((step.problems || []).join('; '))}`;
  if (step.type === 'thought') return 'THOUGHT';
  if (step.type === 'final') return 'FINAL ANSWER';
  return esc(step.type || 'STEP');
}

function stepBody(step) {
  if (step.type === 'tool_call') return step.observation || '';
  if (step.type === 'tool_error') return (step.problems || []).join('\n');
  if (step.type === 'thought') return step.content || '';
  if (step.type === 'final') return step.content || '';
  return JSON.stringify(step, null, 2);
}

function answerHtml(res) {
  let html = citeHtml(md(res.answer || '(no answer)'));
  if (res.error) html += `<div class="warnbox">agent error: ${esc(res.error)}</div>`;
  if (res.citation_warnings && res.citation_warnings.length)
    html += `<div class="warnbox">⚠ citation check: ${res.citation_warnings.map(esc).join('<br>')}</div>`;
  return html;
}

async function send() {
  const q = $('question').value.trim();
  if (!q) return;
  $('question').value = '';
  addMsg('user', q);
  history.push({ role: 'user', content: q });

  const holder = addMsg('agent', '');
  holder.innerHTML = `<div class="live">
      <details class="trace" open>
        <summary><span class="dot"></span><span class="sum">working — triage…</span><span class="el"></span></summary>
        <div class="steps"></div>
      </details>
      <div class="answer"></div>
    </div>`;
  const det = holder.querySelector('details.trace');
  const stepsBox = holder.querySelector('.steps');
  const answerBox = holder.querySelector('.answer');
  const sumEl = holder.querySelector('.sum');
  const dot = holder.querySelector('.dot');

  const el = holder.querySelector('.el');
  const ac = new AbortController();
  inflight = ac;
  let steps = 0, tools = 0, userToggled = false, finished = false;
  // A silent stream is the one failure the user cannot distinguish from "still
  // thinking": keep the elapsed time visible, name a long silence, and give up on
  // a stream that has produced nothing for STALL_ABORT_MS (a stalled model call used
  // to sit on 'working — triage…' until the 10-minute read timeout).
  const startedAt = Date.now();
  let lastFrame = startedAt, tick = null, abandoned = false;
  const STALL_MS = 45000, STALL_ABORT_MS = 240000;
  // if the user folds the trace while it runs, respect that: never re-open it
  det.addEventListener('toggle', () => { if (!finished) userToggled = true; });

  const bump = (text) => { sumEl.innerHTML = text; };
  const addStage = (text) => {
    const div = document.createElement('div');
    div.className = 'stage';
    div.textContent = text;
    stepsBox.appendChild(div);
  };
  const addStep = (step) => {
    const d = document.createElement('details');
    d.className = 'step' + (step.type === 'tool_error' ? ' err' : '')
                  + ((step.type === 'tool_call' || step.type === 'tool_error') ? ' tool' : '');
    const summary = document.createElement('summary');
    summary.innerHTML = stepLabel(step);
    const pre = document.createElement('pre');
    pre.textContent = stepBody(step);
    d.appendChild(summary);
    d.appendChild(pre);
    stepsBox.appendChild(d);
    steps += 1;
    if (!userToggled) det.open = true;
    bump(`working — ${steps} step(s), ${tools} tool call(s)…`);
    holder.parentElement.scrollTop = holder.parentElement.scrollHeight;
  };

  try {
    tick = setInterval(() => {
      if (finished) return;
      const waited = Math.round((Date.now() - startedAt) / 1000);
      const silent = Math.round((Date.now() - lastFrame) / 1000);
      el.textContent = ` · ${waited}s` + (silent >= 15 ? ` (no output ${silent}s)` : '');
      if (silent >= Math.round(STALL_MS / 1000)) dot.className = 'dot stalled';
      if (silent * 1000 >= STALL_ABORT_MS) { abandoned = true; try { ac.abort(); } catch {} }
    }, 1000);

    await streamAsk({ question: q, history: history.slice(-10) }, (event, data) => {
      lastFrame = Date.now();
      if (event === 'stage') {
        if (data.name === 'triage') addStage('triage — classifying the question');
        else if (data.name === 'routed')
          addStage(`routed: ${data.intent} → ${data.route}`);
        return;
      }
      if (event === 'turn') { bump(`working — turn ${data.n}, ${steps} step(s), ${tools} tool call(s)…`); return; }
      if (event === 'step') {
        if (data.type === 'tool_call') tools += 1;
        addStep(data);
        return;
      }
      if (event === 'error') {
        addStep({ type: 'tool_error', tool: 'agent', problems: [data.error] });
        finished = true;
        dot.className = 'dot done';
        sumEl.textContent = 'failed';
        answerBox.innerHTML = `<span class="warnbox">⚠ the agent failed: ${esc(data.error)}</span>`;
        return;
      }
      if (event === 'final') {
        finished = true;
        el.textContent = '';                 // the clock is for waiting, not for the record
        answerBox.innerHTML = answerHtml(data);
        dot.className = 'dot done';
        sumEl.textContent = `ReAct trace — ${data.tool_calls || tools} tool call(s), `
          + `${data.elapsed_s || '?'}s · ${steps} step(s)`;
        // the work is over: fold the trace unless the user opened it themselves
        if (!userToggled) det.open = false;
        history.push({ role: 'assistant', content: data.answer || '' });
        holder.parentElement.scrollTop = holder.parentElement.scrollHeight;
      }
    }, ac.signal);
    if (!finished) {          // closed with no answer: say so instead of spinning forever
      finished = true;
      dot.className = 'dot done';
      sumEl.textContent = 'no answer';
      answerBox.innerHTML = '<span class="warnbox">⚠ the stream ended before an answer '
        + 'arrived — the model may have timed out. Ask again.</span>';
    }
  } catch (e) {
    if (e.name === 'AbortError') {          // the user aborted, or the watchdog gave up
      finished = true;
      if (abandoned) {
        dot.className = 'dot done';
        sumEl.textContent = 'stopped — no response';
        answerBox.innerHTML = '<span class="warnbox">⚠ no output for '
          + Math.round(STALL_ABORT_MS / 1000) + 's, so the request was stopped. '
          + 'Ask again, or check that the model endpoint is up.</span>';
      }
      return;
    }
    // streaming unavailable: answer the old way rather than losing the question
    try {
      const res = await api('/api/ask', {
        method: 'POST',
        body: JSON.stringify({ question: q, history: history.slice(-10) }),
      });
      finished = true;
      answerBox.innerHTML = answerHtml(res);
      dot.className = 'dot done';
      sumEl.textContent = `answered without streaming — ${res.tool_calls || 0} tool call(s)`;
      if (!userToggled) det.open = false;
      history.push({ role: 'assistant', content: res.answer || '' });
    } catch (e2) {
      if (e2.name === 'AbortError') return;
      const why = /Failed to fetch|NetworkError/i.test(e2.message)
        ? 'could not reach the server — it may have stopped or restarted'
        : e2.message;
      answerBox.innerHTML = `<span class="warnbox">⚠ ${esc(why)}</span>`;
      finished = true;
      dot.className = 'dot done';
      sumEl.textContent = 'failed';
    }
  } finally {
    if (tick) clearInterval(tick);
    if (inflight === ac) inflight = null;
  }
  $('chatlog').scrollTop = $('chatlog').scrollHeight;
}

function newConversation() {
  // stop a running answer first: it belongs to the conversation being discarded
  if (inflight) { try { inflight.abort(); } catch {} inflight = null; }
  history.length = 0;
  $('chatlog').innerHTML = '';
  addMsg('agent', WELCOME);
  $('question').value = '';
  $('question').focus();
}

$('sendBtn').addEventListener('click', send);
$('newChat').addEventListener('click', newConversation);
// citation chips are buttons inside rendered answers: delegate, so answers added
// later (streamed or restored) work without re-binding
$('chatlog').addEventListener('click', (ev) => {
  const b = ev.target.closest('button.cite');
  if (b) openCitation(b.dataset.cite, b);
});
$('citeClose').addEventListener('click', () => { $('citePanel').hidden = true; });
$('citeRaw').addEventListener('click', () => {
  const b = $('citeRaw');
  b.dataset.on = b.dataset.on === '1' ? '0' : '1';
  if (citeLast !== null) paintCitation();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') $('citePanel').hidden = true;
});
$('question').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
